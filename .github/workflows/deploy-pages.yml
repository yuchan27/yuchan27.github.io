name: Validate portfolio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
        with:
          persist-credentials: false
      - name: Validate static site
        run: |
          node --version
          npm test

# Publication uses the repository's existing GitHub Pages main / (root)
# source. The built-in Pages workflow publishes index.html after a push.
# This workflow validates only: no npm install, cache, build, or API keys.
